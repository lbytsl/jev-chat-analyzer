# CI：离线、不烧额度。
#
# 测试套件全部用假上游（见 tests/conftest.py），所以这里**不配任何 API key**，
# 也不会因为上游抖动变红。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: 后端（ruff + pytest + 覆盖率）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 含 dev 组：ruff / pytest / pytest-cov / pre-commit
      - name: 同步依赖
        run: uv sync

      # 规则集钉在 pyproject.toml 的 [tool.ruff.lint] 里，不依赖本机隐式配置。
      - name: 静态检查
        run: uv run ruff check .

      # --cov 会读 pyproject 的 [tool.coverage.*]，低于 fail_under 直接失败。
      - name: 离线测试 + 覆盖率
        run: uv run pytest --cov --cov-report=term-missing

  frontend:
    name: 前端（lint + 单测 + 一致性 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本只从 frontend/package.json 的 packageManager 字段读（单一来源，不在这里重复写死）。
      # 必须显式指定文件：本仓库的 package.json 在子目录里，根目录没有，
      # action 默认去根目录找 package.json，找不到就报 "No pnpm version is specified"。
      - name: 装 pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 说话人识别的规则前后端各有一份（前端要实时显示 chips），这份共享用例是唯一的兜底。
      - name: 说话人识别一致性
        working-directory: frontend
        run: pnpm run check:transcript

      - name: 静态检查
        working-directory: frontend
        run: pnpm run lint

      - name: 单测
        working-directory: frontend
        run: pnpm run test

      - name: 构建
        working-directory: frontend
        run: pnpm run build
